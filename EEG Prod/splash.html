<!DOCTYPE html>
<html>

<head>
	<title>Loading...</title>
	<link href="bootstrap.min.css" rel="stylesheet">
	<style>
		.loader-line {
			width: 60%;
			height: 3px;
			position: relative;
			overflow: hidden;
			background-color: #ddd;
			-webkit-border-radius: 20px;
			-moz-border-radius: 20px;
			border-radius: 20px;
		}

		.loader-line:before {
			content: "";
			position: absolute;
			left: -50%;
			height: 3px;
			width: 40%;
			background-color: #b606c5;
			-webkit-animation: lineAnim 1s linear infinite;
			-moz-animation: lineAnim 1s linear infinite;
			animation: lineAnim 1s linear infinite;
			-webkit-border-radius: 20px;
			-moz-border-radius: 20px;
			border-radius: 20px;
		}

		@keyframes lineAnim {
			0% {
				left: -40%;
			}

			50% {
				left: 20%;
				width: 80%;
			}

			100% {
				left: 100%;
				width: 100%;
			}
		}
	</style>
</head>

<body>
	<div class="container vh-100 d-flex align-items-center">
		<div class="row bg-black text-white p-5 rounded-5 mx-auto align-items-center gy-4">
			<div class="col-md-6">
				<div class="fs-1">Brasig</div>
				<div class="fs-5">INDReA Lab, Department of Design, IIT Hyderabad</div>
				<div class="mt-4">
					<div class="loader-line"></div>
				</div>
			</div>
			<div class="col-md-6">
				<img src="brain.gif" class="img-fluid" />
			</div>
		</div>
	</div>
</body>

</html>
