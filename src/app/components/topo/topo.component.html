<div class="vh-100 border border-warning p-2">
	<div class="h-100 d-flex flex-column shadow-lg rounded-3 p-3">
		<div class="fw-medium text-smaller">
			Scalp topomaps of the ICA components
		</div>
		<div class="h-100 overflow-hidden mt-2 border rounded-3 p-2 d-flex justify-content-center align-items-center">
			<img [src]="topoPlotUrl" class="h-100 w-auto" />
		</div>
	</div>
</div>


<div id="loader-overlay"
	class="position-fixed top-0 start-0 w-100 h-100 bg-opacity-25 d-flex justify-content-center align-items-center backdrop-blur"
	[class.d-none]="!loading">
	<img src="loading.gif" alt="Loading..." class="img-fluid rounded-5" id="loaderImg">
</div>
